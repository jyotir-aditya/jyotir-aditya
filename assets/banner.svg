<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Jyotiraditya — full-stack dev building AI-powered products and dev tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#120d0a"/>
      <stop offset="55%" stop-color="#1c140e"/>
      <stop offset="100%" stop-color="#0d1210"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0"/>
      <stop offset="45%" stop-color="#fb923c" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#34d399" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff4e6"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#fdba74" fill-opacity="0.10"/>
    </pattern>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="260" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="16" fill="url(#dots)"/>
  <ellipse cx="240" cy="80" rx="380" ry="170" fill="url(#halo)"/>
  <ellipse cx="1000" cy="210" rx="320" ry="150" fill="url(#halo2)"/>
  <rect width="1200" height="260" rx="16" fill="url(#sweep)"/>

  <g font-family="'JetBrains Mono','Cascadia Code','SFMono-Regular',ui-monospace,Menlo,Consolas,monospace">
    <text x="64" y="80" font-size="15" fill="#fdba74" letter-spacing="3" opacity="0.9">$ whoami</text>

    <text x="64" y="146" font-size="54" font-weight="700" filter="url(#glow)">
      <tspan fill="url(#ink)">Jyotiraditya</tspan><tspan fill="#34d399" dx="10">&#9612;<animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></tspan>
      <animate attributeName="opacity" values="0;1" dur="0.9s" fill="freeze"/>
    </text>

    <text x="66" y="188" font-size="16" fill="#c8b8a6" letter-spacing="1.2">
      full-stack dev &#183; AI-powered products &#183; dev tools &#183; ship it, prove it
    </text>

    <g font-size="13" letter-spacing="1">
      <text x="66" y="224" fill="#34d399">&#10003; build</text>
      <text x="146" y="224" fill="#34d399">&#10003; verify</text>
      <text x="236" y="224" fill="#34d399">&#10003; ship</text>
      <text x="312" y="224" fill="#8a7b6d">&#8212; 3/3 steps passed</text>
    </g>
  </g>

  <g transform="translate(884 60)" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="12">
    <rect width="254" height="118" rx="10" fill="#0b0907" fill-opacity="0.6" stroke="#fb923c" stroke-opacity="0.35"/>
    <circle cx="16" cy="16" r="4" fill="#f87171"/><circle cx="30" cy="16" r="4" fill="#fbbf24"/><circle cx="44" cy="16" r="4" fill="#34d399"/>
    <text x="16" y="46" fill="#fdba74">stack</text><text x="80" y="46" fill="#e7dccf">next · node · go · py</text>
    <text x="16" y="68" fill="#fdba74">now</text><text x="80" y="68" fill="#e7dccf">ai · full-stack</text>
    <text x="16" y="90" fill="#fdba74">prs</text><text x="80" y="90" fill="#e7dccf">60+ merged</text>
    <text x="16" y="108" fill="#8a7b6d">status: <tspan fill="#34d399">shipping<animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/></tspan></text>
  </g>
</svg>
